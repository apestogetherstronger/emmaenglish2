<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131f24">
  <meta name="description" content="Your daily English–Hebrew learning adventure. Practise words, listen, match pairs, and grow with a 30-exercise daily goal.">
  <title>Emma English · Your daily adventure</title>
  <link rel="icon" href="./favicon.svg?v=2.1.0" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=2.1.0">
  <script type="module" src="./app.js?v=2.1.0"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="Skip to practice">Skip to practice</a>
  <div class="app-layout">
    <aside class="sidebar" data-i18n-label="Main navigation" aria-label="Main navigation">
      <a href="#learn" data-page="learn" class="brand" data-i18n-label="Emma English home" aria-label="Emma English home"><span class="brand-mark" aria-hidden="true">e<span>e</span></span><span dir="ltr">emma<span class="brand-second">english</span></span></a>
      <p class="nav-caption" data-i18n="A LITTLE EVERY DAY">A LITTLE EVERY DAY</p>
      <nav class="nav-links">
        <a href="#learn" data-page="learn"><span data-icon="learn"></span><span data-i18n="Learn">Learn</span></a>
        <a href="#words" data-page="words"><span data-icon="book"></span><span data-i18n="My words">My words</span></a>
        <a href="#progress" data-page="progress"><span data-icon="chart"></span><span data-i18n="My progress">My progress</span></a>
      </nav>
      <div class="sidebar-note"><span data-icon="star"></span><strong data-i18n="Small steps. New words.">Small steps. New words.</strong><p data-i18n="Every try takes you forward.">Every try takes you forward.</p></div>
      <button class="settings-nav" data-action="settings"><span data-icon="settings"></span><span data-i18n="Practice settings">Practice settings</span></button>
      <div class="sidebar-bottom" data-i18n="English ↔ Hebrew">English ↔ Hebrew</div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <a class="mobile-brand" href="#learn" data-page="learn" aria-label="Emma English" dir="ltr">ee<span>✦</span></a>
        <div class="top-stats"><span class="streak-pill" id="streak-pill"></span><span class="xp-pill" id="xp-pill"></span></div>
        <div class="topbar-right">
          <button class="language-toggle" id="language-toggle" data-action="toggle-language" lang="he" dir="rtl" aria-label="Switch interface to Hebrew">עברית</button>
          <button class="icon-button sound-toggle" id="sound-toggle" data-action="toggle-effects" aria-label="Turn answer sounds off"></button>
          <button class="icon-button" data-action="settings" data-i18n-label="Practice settings" aria-label="Practice settings"><span data-icon="settings"></span></button>
        </div>
      </header>
      <main id="main" tabindex="-1"><div class="loading-state"><span class="loading-dot"></span><h1 data-i18n="Finding your words…">Finding your words…</h1><p data-i18n="Getting your practice ready.">Getting your practice ready.</p></div></main>
      <footer class="app-footer"><span data-i18n="Every try takes you forward.">Every try takes you forward.</span><span dir="ltr">emma english <span aria-hidden="true">✦</span></span></footer>
    </div>
  </div>
  <dialog id="settings-dialog" aria-labelledby="settings-title"></dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">Please enable JavaScript to practise. <span lang="he" dir="rtl">יש להפעיל JavaScript כדי לתרגל.</span></p></noscript>
